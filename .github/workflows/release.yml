name: Release

# Pushing a version tag (v1.2.3, or v1.3.0-beta.1 for a pre-release) builds the
# Linux packages and publishes them as a GitHub release. It can also be re-run by
# hand for an existing tag from the Actions tab.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # create the release and upload files
      id-token: write     # sign the build-provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs unless an
      # AppArmor profile is installed; the .deb installs one, the runner has none.
      - name: Allow the Chromium sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render icons from icon.svg
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a npm run icons

      - name: Build .deb and AppImage
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.deb *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.AppImage

      - name: Release notes
        run: node scripts/release-notes.js "$TAG" > dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.deb dist/*.AppImage dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            extra=()
            [[ "$TAG" == *-* ]] && extra+=(--prerelease)
            gh release create "$TAG" "${files[@]}" \
              --title "Teams $TAG" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag "${extra[@]}"
          fi
