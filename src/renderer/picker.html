<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Share your screen</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <header>
    <h1>Choose what to share</h1>
    <div class="tabs" role="tablist">
      <button role="tab" data-kind="screen" aria-selected="true">Screens</button>
      <button role="tab" data-kind="window" aria-selected="false">Windows</button>
    </div>
  </header>
  <main id="grid" role="listbox" aria-label="Sources"></main>
  <footer>
    <button id="cancel">Cancel</button>
    <button id="share" class="primary" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
