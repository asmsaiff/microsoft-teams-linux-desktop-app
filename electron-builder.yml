appId: com.mintmediaservices.teamsdesktop
productName: Teams
executableName: teams-desktop
copyright: Copyright © 2026 Mint Media Services

directories:
  output: dist
  buildResources: build

files:
  - package.json
  - src/**/*
  - "!**/*.map"
  - "!**/*.md"

asar: true
compression: maximum

# Hardening switches baked into the Electron binary (cannot be flipped at runtime).
electronFuses:
  runAsNode: false                           # ELECTRON_RUN_AS_NODE can't turn the app into a Node shell
  enableNodeOptionsEnvironmentVariable: false # NODE_OPTIONS is ignored
  enableNodeCliInspectArguments: false       # --inspect / --inspect-brk are ignored
  onlyLoadAppFromAsar: true                  # code is only loaded from the packaged app.asar
  enableCookieEncryption: true               # cookies encrypted with the GNOME keyring
  grantFileProtocolExtraPrivileges: false    # file:// pages get no extra powers
  loadBrowserProcessSpecificV8Snapshot: false
  enableEmbeddedAsarIntegrityValidation: false # not supported on Linux

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: build/icons
  artifactName: ${productName}-${version}-x86_64.${ext}
  category: Network
  synopsis: Microsoft Teams for Linux
  description: Fast, hardened Microsoft Teams desktop client for Linux.
  maintainer: Mint Media Services <claude@mintmediaservices.com>
  vendor: Mint Media Services
  syncDesktopName: true
  mimeTypes:
    - x-scheme-handler/msteams
  desktop:
    entry:
      Name: Microsoft Teams
      GenericName: Team Chat
      Comment: Chat, meetings and calls with Microsoft Teams
      Categories: Network;InstantMessaging;Chat;VideoConference;
      Keywords: teams;microsoft;chat;meeting;call;
      StartupNotify: "true"

deb:
  packageName: teams-desktop
  artifactName: teams-desktop_${version}_amd64.${ext}
  packageCategory: net
  priority: optional
  # Ubuntu 24.04+ renamed several libraries with a t64 suffix; keep both so the
  # package also installs on 22.04.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
  recommends:
    - gnome-keyring
    - libappindicator3-1 | libayatana-appindicator3-1
    - xdg-desktop-portal
